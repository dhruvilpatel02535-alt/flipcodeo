backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "hero"
    label: "Hero Section"
    folder: "src/content/hero"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Price Text", name: "price", widget: "string" }
      - { label: "Button 1 Text", name: "btn1_text", widget: "string" }
      - { label: "Button 1 Link", name: "btn1_link", widget: "string" }
      - { label: "Button 2 Text", name: "btn2_text", widget: "string" }
      - { label: "Button 2 Link", name: "btn2_link", widget: "string" }

  - name: "about"
    label: "About Section"
    folder: "src/content/about"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
      - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
      - { label: "Skills (comma separated)", name: "skills", widget: "string" }

  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Icon (emoji)", name: "icon", widget: "string", hint: "Jaise: 🎨 ⚡ 🛒" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "pricing"
    label: "Pricing Plans"
    folder: "src/content/pricing"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Plan Name", name: "name", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Note", name: "note", widget: "string", default: "One-time payment (domain extra)" }
      - { label: "Features (comma separated)", name: "features", widget: "text" }
      - { label: "Muted Features (comma separated)", name: "muted", widget: "text", required: false }
      - { label: "Popular (Most Popular badge)", name: "popular", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      
  - name: "addons"
    label: "Add-ons"
    folder: "src/content/addons"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Note", name: "note", widget: "string" }
      - { label: "Price", name: "price", widget: "string", hint: "Jaise: + ₹3,000" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "process"
    label: "Process Steps"
    folder: "src/content/process"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "why"
    label: "Why Choose Us"
    folder: "src/content/why"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Icon (emoji)", name: "icon", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 1 }    
  
  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "blog"
    label: "Blog Articles"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Tag (Category)", name: "tag", widget: "string", hint: "Jaise: Business, SEO, Pricing" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt (Short Description)", name: "excerpt", widget: "text" }
      - { label: "Body (HTML allowed)", name: "body", widget: "text", hint: "Use HTML tags like <p>, <h3>, <ul>, <li>, <strong>" }
      - { label: "Order", name: "order", widget: "number", default: 1 }    

  - name: "contact"
    label: "Contact Section"
    folder: "src/content/contact"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Phone (WhatsApp)", name: "phone", widget: "string" }
      - { label: "Phone Note", name: "phone_note", widget: "text" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "WhatsApp Number (with country code, no +)", name: "whatsapp_number", widget: "string", hint: "Jaise: 918128302535" }
          
  - name: "portfolio"
    label: "Portfolio Photos"
    folder: "src/content/portfolio"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "Website" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Order", name: "order", widget: "number", default: 1 }