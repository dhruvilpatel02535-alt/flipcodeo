backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "hero"
    label: "Hero Section"
    folder: "src/content/hero"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Price Text", name: "price", widget: "string" }
      - { label: "Button 1 Text", name: "btn1_text", widget: "string" }
      - { label: "Button 1 Link", name: "btn1_link", widget: "string" }
      - { label: "Button 2 Text", name: "btn2_text", widget: "string" }
      - { label: "Button 2 Link", name: "btn2_link", widget: "string" }

  - name: "about"
    label: "About Section"
    folder: "src/content/about"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
      - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
      - { label: "Skills (comma separated)", name: "skills", widget: "string" }

  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Icon (emoji)", name: "icon", widget: "string", hint: "Jaise: 🎨 ⚡ 🛒" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "pricing"
    label: "Pricing Plans"
    folder: "src/content/pricing"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Plan Name", name: "name", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Note", name: "note", widget: "string", default: "One-time payment (domain extra)" }
      - { label: "Features (comma separated)", name: "features", widget: "text" }
      - { label: "Muted Features (comma separated)", name: "muted", widget: "text", required: false }
      - { label: "Popular (Most Popular badge)", name: "popular", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      
  - name: "addons"
    label: "Add-ons"
    folder: "src/content/addons"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Add-on 1 Name", name: "addon1_name", widget: "string" }
      - { label: "Add-on 1 Note", name: "addon1_note", widget: "string" }
      - { label: "Add-on 1 Price", name: "addon1_price", widget: "string" }
      - { label: "Add-on 2 Name", name: "addon2_name", widget: "string" }
      - { label: "Add-on 2 Note", name: "addon2_note", widget: "string" }
      - { label: "Add-on 2 Price", name: "addon2_price", widget: "string" }
      - { label: "Add-on 3 Name", name: "addon3_name", widget: "string" }
      - { label: "Add-on 3 Note", name: "addon3_note", widget: "string" }
      - { label: "Add-on 3 Price", name: "addon3_price", widget: "string" }
      - { label: "Add-on 4 Name", name: "addon4_name", widget: "string" }
      - { label: "Add-on 4 Note", name: "addon4_note", widget: "string" }
      - { label: "Add-on 4 Price", name: "addon4_price", widget: "string" }
      - { label: "Add-on 5 Name", name: "addon5_name", widget: "string" }
      - { label: "Add-on 5 Note", name: "addon5_note", widget: "string" }
      - { label: "Add-on 5 Price", name: "addon5_price", widget: "string" }
      - { label: "Add-on 6 Name", name: "addon6_name", widget: "string" }
      - { label: "Add-on 6 Note", name: "addon6_note", widget: "string" }
      - { label: "Add-on 6 Price", name: "addon6_price", widget: "string" }

  - name: "process"
    label: "Process Steps"
    folder: "src/content/process"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Step 1 Title", name: "step1_title", widget: "string" }
      - { label: "Step 1 Description", name: "step1_desc", widget: "text" }
      - { label: "Step 2 Title", name: "step2_title", widget: "string" }
      - { label: "Step 2 Description", name: "step2_desc", widget: "text" }
      - { label: "Step 3 Title", name: "step3_title", widget: "string" }
      - { label: "Step 3 Description", name: "step3_desc", widget: "text" }
      - { label: "Step 4 Title", name: "step4_title", widget: "string" }
      - { label: "Step 4 Description", name: "step4_desc", widget: "text" }
      - { label: "Step 5 Title", name: "step5_title", widget: "string" }
      - { label: "Step 5 Description", name: "step5_desc", widget: "text" }

  - name: "portfolio"
    label: "Portfolio Photos"
    folder: "src/content/portfolio"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "Website" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Order", name: "order", widget: "number", default: 1 }